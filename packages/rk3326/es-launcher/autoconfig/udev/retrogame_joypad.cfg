# RetroArch udev autoconfig profile for the r36max2's built-in controls.
#
# Why this file has to exist at all: measured on the board, RetroArch sees the pad and
# then gives up on it -
#   [INFO] [udev] Pad #0 (/dev/input/event2) supports force feedback.
#   [INFO] [Autoconf] retrogame_joypad (18507/4353) not configured.
# - and with no profile every RetroPad button is unmapped, which is what the user
# reported as "进入游戏后按键不起作用" right after the game started displaying. The card
# has no autoconfig database anywhere (/usr/share/retroarch does not exist,
# /usr/share/libretro/autoconfig does not exist, ~/.config/retroarch/autoconfig is an
# empty directory RetroArch created itself), so nothing could ever match this device.
#
# The numbers are the pad's own button indices, not evdev codes. Two independent
# derivations agree, which is the part worth keeping:
#   * /proc/bus/input/devices for this device reads
#       B: KEY=f00000000 0 0 0 7fdb000000000000 0 0 0 0     (word17=0xf, word9=0x7fdb0000)
#       B: ABS=1b
#     i.e. codes 304,305,307,308,310..318 (13 gamepad buttons) plus 544..547
#     (BTN_DPAD_UP/DOWN/LEFT/RIGHT) = 17 buttons, and ABS_X/Y/RX/RY = 4 axes. Ranked
#     ascending that is SOUTH=0 EAST=1 NORTH=2 WEST=3 TL=4 TR=5 TL2=6 TR2=7 SELECT=8
#     START=9 MODE=10 THUMBL=11 THUMBR=12 DPAD_UP=13 DOWN=14 LEFT=15 RIGHT=16 -
#     identical to the numbers evtest produced for es-input-r36max2.cfg on this board.
#   * the convention itself, checked against 435 shipped udev profiles in the same
#     database (a Trimui card's RetroArch/.retroarch/autoconfig/udev): every _btn value
#     is 0..31 and not one is >=200, so a profile could not be carrying evdev codes.
#     odroidgo3_joypad.cfg - the same kind of platform-driver joypad - is
#     b=0 a=1 x=2 y=3 l=4 r=5 l2=6 r2=7 up..right=8..11 select=14 start=15, i.e. the
#     same rank rule over a different set of codes.
#
# Retro semantics, which is where a/b/x/y come from. The rule is SNES geometry, not Xbox
# labels: a RetroPad's B is the bottom button, A the right one, X the TOP one and Y the
# LEFT one. Confirmed against the Logitech F310 profile in the same database, which is
# useful precisely because it carries the physical labels next to each binding -
#   input_b_btn = "0" ... input_b_btn_label = "A"      (BTN_SOUTH, bottom)
#   input_a_btn = "1" ... input_a_btn_label = "B"      (BTN_EAST, right)
#   input_y_btn = "2" ... input_y_btn_label = "X"      (BTN_WEST, left)
#   input_x_btn = "3" ... input_x_btn_label = "Y"      (BTN_NORTH, top)
# so retro X takes BTN_NORTH and retro Y takes BTN_WEST regardless of what a shell is
# printed with. On this pad those codes rank 2 and 3 (NORTH=307 before WEST=308), which is
# why x=2 and y=3 - writing the intuitive-looking x=left/y=top would swap X and Y in every
# game, silently. ES binds confirm to its own "a", so the two files disagree about *names*
# while agreeing about which physical button is which index; do not "fix" one to match the
# other.
#
# Hotkey: BTN_MODE (10) is the enable, so MODE+START quits and MODE+SELECT opens the
# quick menu - the same button ES already uses as its "hotkey" (es-input-r36max2.cfg),
# so the user has one modifier to learn, not two.
input_driver = "udev"
input_device = "retrogame_joypad"
input_device_display_name = "R36 Max 2 Joypad"
input_vendor_id = "18507"
input_product_id = "4353"

input_b_btn = "0"
input_a_btn = "1"
input_x_btn = "2"
input_y_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_l2_btn = "6"
input_r2_btn = "7"
input_select_btn = "8"
input_start_btn = "9"
input_enable_hotkey_btn = "10"
input_l3_btn = "11"
input_r3_btn = "12"
input_up_btn = "13"
input_down_btn = "14"
input_left_btn = "15"
input_right_btn = "16"
input_menu_toggle_btn = "8"

input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "+3"
input_r_y_minus_axis = "-3"

input_b_btn_label = "Bottom (BTN_SOUTH)"
input_a_btn_label = "Right (BTN_EAST)"
input_y_btn_label = "Top (BTN_NORTH)"
input_x_btn_label = "Left (BTN_WEST)"
input_l_btn_label = "L1"
input_r_btn_label = "R1"
input_l2_btn_label = "L2"
input_r2_btn_label = "R2"
input_select_btn_label = "Select"
input_start_btn_label = "Start"
input_enable_hotkey_btn_label = "Menu"
input_l3_btn_label = "L3"
input_r3_btn_label = "R3"
input_up_btn_label = "Dpad Up"
input_down_btn_label = "Dpad Down"
input_left_btn_label = "Dpad Left"
input_right_btn_label = "Dpad Right"
input_l_x_plus_axis_label = "LS Right"
input_l_x_minus_axis_label = "LS Left"
input_l_y_plus_axis_label = "LS Down"
input_l_y_minus_axis_label = "LS Up"
input_r_x_plus_axis_label = "RS Right"
input_r_x_minus_axis_label = "RS Left"
input_r_y_plus_axis_label = "RS Down"
input_r_y_minus_axis_label = "RS Up"
