# r36max2 - RetroArch settings this board needs, loaded with --appendconfig by
# r36-play so they win over whatever is in ~/.config/retroarch/retroarch.cfg.
#
# Why this file has to ship, measured on the board both ways with no per-user config
# present (which is what a freshly flashed card has):
#   no config        -> [ERROR] [PulseAudio] Connection failed
#                    -> [ERROR] Failed to initialize audio driver. Will continue
#                       without audio.   (game runs, silent)
#   --appendconfig   -> [INFO] [ALSA] Initialized PLAYBACK device "default".
#                    -> [INFO] [Audio] Started synchronous audio driver.   (audible)
# Note what the default is NOT: RetroArch writes audio_driver = "alsa" into the config
# it saves on exit, which looks like "alsa was the default" - it is the fallback it
# recorded after the PulseAudio attempt failed. The runtime default is pulse.
audio_driver = "alsa"
audio_device = "default"
audio_out_rate = "48000"
audio_latency = "64"

# The panel is 1024x768 and the only DRM connector; KMS+GL is what both ES and
# RetroArch use here (weston is installed but not enabled).
video_driver = "gl"
video_fullscreen = "true"
video_monitor_aspect_ratio = "4:3"

# Cores and BIOS live where this image puts them, not in ~/.config.
# No rgui_assets_directory line on purpose: /usr/share/retroarch does not exist in
# the Ubuntu package, and a path that is not there is worse than no path at all.
libretro_path = "/usr/lib/libretro/"
system_directory = "/roms/bios"
savefile_directory = "/roms/saves"
savestate_directory = "/roms/states"

# No menu on boot: ES is the front end, and the RGUI overlay needs a keyboard to
# escape from on a board with no keyboard.
menu_driver = "null"

input_driver = "udev"
