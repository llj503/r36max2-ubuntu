<?xml version="1.0" encoding="UTF-8"?>
<!-- Real systems, one per emulator/core set that is actually installed.

     A cfg with zero systems is not an option: this fork logs
     "ERROR es_systems.cfg file does not exist!" and exits, and with no systems no
     theme/resources path is ever exercised, so a fresh image gives nothing to look at
     and the stick cannot be shown to navigate. That is why v21 shipped a single
     "demo" placeholder; it is replaced here as cores land.

     Every <command> is "<wrapper> %ROM%" on purpose. ES-DE appends
     "-emulator <name> -core <name>" itself when the command does not already mention
     them (es-app/src/FileData.cpp:553-557), and r36-play consumes those two flags and
     turns the core name into /usr/lib/libretro/<core>_libretro.so. Passing %EMULATOR%
     or %CORE% straight to retroarch would not work: it rejects an "-emulator"
     argument.

     <core> names must equal the installed library's stem (fceumm, snes9x2010,
     vba_next, pcsx_rearmed), because that is what r36-play turns into a filename.

     ROM directory names and extensions follow the user's ROM pack
     (I:\寨中寨EE4.7通用游戏包128G): nes/ holds .zip-wrapped iNES, snes/ .sfc/.smc,
     gba/ .gba, psx/ .pbp and .chd. A system whose <path> does not exist is dropped
     without an error, which is why the image also creates /roms/<system>.

     dreamcast/ and saturn/ in that pack are almost entirely .chd, which is why both
     cores are built with CHD support on (flycast compiles libretro-common's rchd
     reader; satune builds its vendored libchdr). Both also need a BIOS from
     /roms/bios - dc_boot.bin for Dreamcast, saturn_bios.bin for Saturn - and the pack
     carries both. -->
<systemList>
  <system>
    <name>nes</name>
    <fullname>Nintendo Entertainment System</fullname>
    <path>/roms/nes</path>
    <extension>.nes .NES .fds .FDS .unf .UNF .zip .ZIP .7z .7Z</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>nes</platform>
    <theme>nes</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>fceumm</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>snes</name>
    <fullname>Super Nintendo Entertainment System</fullname>
    <path>/roms/snes</path>
    <extension>.sfc .SFC .smc .SMC .fig .FIG .zip .ZIP .7z .7Z</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>snes</platform>
    <theme>snes</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>snes9x2010</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>gba</name>
    <fullname>Nintendo Game Boy Advance</fullname>
    <path>/roms/gba</path>
    <extension>.gba .GBA .agb .AGB .zip .ZIP .7z .7Z</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>gba</platform>
    <theme>gba</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>mgba</core>
          <core>vba_next</core>
          <core>gpsp_ezode</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>psx</name>
    <fullname>Sony PlayStation</fullname>
    <path>/roms/psx</path>
    <extension>.cue .CUE .chd .CHD .pbp .PBP .bin .BIN .iso .ISO .img .IMG .exe .EXE .zip .ZIP .7z .7Z</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>psx</platform>
    <theme>psx</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>pcsx_rearmed</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>gb</name>
    <fullname>Nintendo Game Boy</fullname>
    <path>/roms/gb</path>
    <extension>.gb .GB .zip .ZIP .7z .7Z</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>gb</platform>
    <theme>gb</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>gambatte</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>gbc</name>
    <fullname>Nintendo Game Boy Color</fullname>
    <path>/roms/gbc</path>
    <extension>.gbc .GBC .gb .GB .zip .ZIP .7z .7Z</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>gbc</platform>
    <theme>gbc</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>gambatte</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>dreamcast</name>
    <fullname>Sega Dreamcast</fullname>
    <path>/roms/dreamcast</path>
    <extension>.chd .CHD .cue .CUE .cdi .CDI .gdi .GDI .bin .BIN .iso .ISO .zip .ZIP</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>dreamcast</platform>
    <theme>dreamcast</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>flycast</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>saturn</name>
    <fullname>Sega Saturn</fullname>
    <path>/roms/saturn</path>
    <extension>.chd .CHD .cue .CUE .iso .ISO .bin .BIN .zip .ZIP</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>saturn</platform>
    <theme>saturn</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>mednafen_saturn</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <!-- Arcade, one core (fbneoplus = FBNeo built from source, packages/libretro/
       libretro-fbneoplus). Five systems because that is how the ROM pack is split, not
       because the core differs: measured in the theme, art-book-next ships logos for
       arcade, cps1, cps2, fbneo and neogeo, so all five get proper art, and the image
       already creates all five /roms directories.

       Extensions come from the core itself: libretro.cpp:515 declares
       info->valid_extensions = "zip|7z|cue|ccd", and the pack's fbneo/ dir is 1811 .7z
       files (neogeo/ cps1/ cps2/ are .zip), so .7z has to be listed or that folder would
       show up empty.

       Subfolders are listable: SystemData::populateFolder creates a FolderData per
       subdirectory (SystemData.cpp:412), which is what lets arcade/CAVE/*.zip appear
       under arcade. The ports note above is about .sh files only.

       FBNeo finds its BIOS/extra content in <system_directory>/fbneo/ (and
       <system_directory>/fbneo/{arcade,consoles}/...), measured in locate_archive at
       libretro.cpp:925-1000, and retroarch.cfg sets system_directory=/roms/bios - so
       neogeo.zip belongs in /roms/bios/fbneo/, which es-launcher creates for that reason. -->
  <system>
    <name>fbneo</name>
    <fullname>FB Neo (Arcade)</fullname>
    <path>/roms/fbneo</path>
    <extension>.zip .ZIP .7z .7Z .fbneo .FBNEO</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>fbneo</platform>
    <theme>fbneo</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>fbneoplus</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>neogeo</name>
    <fullname>SNK Neo Geo</fullname>
    <path>/roms/neogeo</path>
    <extension>.zip .ZIP .7z .7Z .fbneo .FBNEO</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>neogeo</platform>
    <theme>neogeo</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>fbneoplus</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>arcade</name>
    <fullname>Arcade (FB Neo)</fullname>
    <path>/roms/arcade</path>
    <extension>.zip .ZIP .7z .7Z .fbneo .FBNEO</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>arcade</platform>
    <theme>arcade</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>fbneoplus</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>cps1</name>
    <fullname>Capcom Play System 1</fullname>
    <path>/roms/cps1</path>
    <extension>.zip .ZIP .7z .7Z .fbneo .FBNEO</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>cps1</platform>
    <theme>cps1</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>fbneoplus</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <system>
    <name>cps2</name>
    <fullname>Capcom Play System 2</fullname>
    <path>/roms/cps2</path>
    <extension>.zip .ZIP .7z .7Z .fbneo .FBNEO</extension>
    <command>/usr/local/bin/r36-play %ROM%</command>
    <platform>cps2</platform>
    <theme>cps2</theme>
    <emulators>
      <emulator name="retroarch">
        <cores>
          <core>fbneoplus</core>
        </cores>
      </emulator>
    </emulators>
  </system>
  <!-- OpenBOR is not a libretro core: it is a standalone engine (packages/emulators/
       openbor-ff) with its own launcher, because the engine takes no rom argument and
       reads games from a "Paks" directory next to its CWD. Same shape as the ports entry
       below: no <emulators> block, r36-openbor consumes whatever ES still appends.
       The pack's openbor/ holds 30 .pak games, so this system has real content to verify
       with. -->
  <system>
    <name>openbor</name>
    <fullname>OpenBOR</fullname>
    <path>/roms/openbor</path>
    <extension>.pak .PAK</extension>
    <command>/usr/local/bin/r36-openbor %ROM%</command>
    <platform>openbor</platform>
    <theme>openbor</theme>
  </system>
  <!-- Ports: PortMaster's own .sh launchers, plus the "Start PortMaster" entry that
       installs it on first use.  .sh files directly under /roms/ports only - a port
       lives in its own subdirectory, and ES does not recurse here, which is what keeps
       the 90-odd scripts inside a port from showing up as separate games. -->
  <system>
    <name>ports</name>
    <fullname>Ports</fullname>
    <path>/roms/ports</path>
    <extension>.sh .SH</extension>
    <command>/usr/local/bin/r36-port %ROM%</command>
    <platform>ports</platform>
    <theme>ports</theme>
  </system>
  <!-- n64 is deliberately NOT listed yet. The core builds with its ARM64 dynarec and installs
       (packages/libretro/libretro-parallel-n64), but every real game SIGSEGVs before the first
       frame, and the kernel reports pc = 0x0 - a call through a null function pointer - right
       after the plugin start. This board's RetroArch context is OpenGL ES 3.1 (Panfrost), and
       the core's default video plugin needs desktop GL entry points that are not there.
       Selecting gles2n64 through the per-core override did not change the crash, and building
       without GLideN64 does not link (libretro.o still references ChangeSize/vbo_disable).
       Re-add this block when the plugin selection is fixed; until then offering the system
       would only hand the user a crash-to-console. -->
</systemList>
