    </emulators>
  </system>
  <!-- OpenBOR is not a libretro core: it is a standalone engine (packages/emulators/
       openbor-ff) with its own launcher, because the engine takes no rom argument and
       reads games from a "Paks" directory next to its CWD. Same shape as the ports entry
       below: no <emulators> block, r36-openbor consumes whatever ES still appends.
       The pack's openbor/ holds 30 .pak games, so this system has real content to verify
       with. -->
  <system>
    <name>openbor</name>
    <fullname>OpenBOR</fullname>
    <path>/roms/openbor</path>
    <extension>.pak .PAK</extension>
    <command>/usr/local/bin/r36-openbor %ROM%</command>
    <platform>openbor</platform>
    <theme>openbor</theme>
  </system>
  <!-- ONScripter: standalone engine again (packages/emulators/onscripter), marker-file
       style like the reference distro - a game is a FOLDER of .arc/.nsa/script files with a
       .ons file inside it, and r36-ons launches the folder containing the marker (the
       engine's root option, which needs two dashes in its long form and is accepted as
       -r, takes a DIRECTORY: onscripter_main.cpp:370 hands it
       to setArchivePath). ES recurses, so the marker can sit at
       /roms/onscripter/<game>/<name>.ons. The games in I:\ONS游戏资源\迷你龙ONS包\ONS carry no
       .ons at all (measured at depth 3), so the marker is something this side creates.

       No emulator block and no core: nothing here goes through RetroArch.

       Checked and false, so it is not claimed: art-book-next has no onscripter.svg in
       _inc/systems/logos (327 logos, none matching), so this system shows the theme's
       fallback art. -->
  <system>
    <name>onscripter</name>
    <fullname>ONScripter</fullname>
    <path>/roms/onscripter</path>
    <extension>.ons .ONS</extension>
    <command>/usr/local/bin/r36-ons %ROM%</command>
    <platform>onscripter</platform>
    <theme>onscripter</theme>
  </system>
  <!-- Ports: PortMaster's own .sh launchers, plus the "Start PortMaster" entry that
       installs it on first use.  .sh files directly under /roms/ports only - a port
       lives in its own subdirectory, and ES does not recurse here, which is what keeps
       the 90-odd scripts inside a port from showing up as separate games. -->
  <system>
    <name>ports</name>
    <fullname>Ports</fullname>
    <path>/roms/ports</path>
    <extension>.sh .SH</extension>
    <command>/usr/local/bin/r36-port %ROM%</command>
    <platform>ports</platform>
    <theme>ports</theme>
  </system>
  <!-- n64 is deliberately NOT listed yet. The core builds with its ARM64 dynarec and installs
       (packages/libretro/libretro-parallel-n64), but every real game SIGSEGVs before the first
       frame, and the kernel reports pc = 0x0 - a call through a null function pointer - right
       after the plugin start. This board's RetroArch context is OpenGL ES 3.1 (Panfrost), and
       the core's default video plugin needs desktop GL entry points that are not there.
       Selecting gles2n64 through the per-core override did not change the crash, and building
       without GLideN64 does not link (libretro.o still references ChangeSize/vbo_disable).
       Re-add this block when the plugin selection is fixed; until then offering the system
       would only hand the user a crash-to-console. -->
</systemList>
