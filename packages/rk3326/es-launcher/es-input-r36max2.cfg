<?xml version="1.0"?>
<!-- EmulationStation input config for the r36max2's built-in controls.
     Generated from measurements on this board, NOT copied from Batocera's database:
       * deviceGUID from SDL itself (packages/gpu-demos/r36-sdljoy.c on the board):
           name=retrogame_joypad  guid=19009b4d4b4800000111000000010000
           17 buttons, 4 axes, 0 hats
       * button numbers = the rank of each BTN_* code in ascending order, which is how
         the Linux joystick core numbers them, read via EVIOCGBIT (tools/capture/r36-capdump.py):
           BTN_SOUTH=0 BTN_EAST=1 BTN_NORTH=2 BTN_WEST=3 BTN_TL=4 BTN_TR=5
           BTN_TL2=6 BTN_TR2=7 BTN_SELECT=8 BTN_START=9 BTN_MODE=10 BTN_THUMBL=11
           BTN_THUMBR=12 BTN_DPAD_UP=13 DOWN=14 LEFT=15 RIGHT=16
         Batocera's retrogame_joypad entry has a/b and x/y swapped relative to this
         (their DT orders those codes differently) - copying it verbatim would have
         made A and B trade places in ES, silently.
     ES action names, per its own InputConfiguration: a/b/x/y are the face buttons,
     start/select as labelled, hotkey is the ES menu/quit modifier (MODE here).
     Axes: 0/1 = left stick X/Y, 2/3 = right stick RX/RY (from the same capdump). -->
<inputList>
	<!-- keyboard defaults taken verbatim from Batocera's controllers/es_input.cfg: ES
	     ships compiled defaults too, but including it guarantees no first-boot wizard for it -->
<inputConfig type="keyboard" deviceName="Keyboard" deviceGUID="-1">
		<input name="up" type="key" id="1073741906" value="1" />
		<input name="down" type="key" id="1073741905" value="1" />
		<input name="left" type="key" id="1073741904" value="1" />
		<input name="right" type="key" id="1073741903" value="1" />
		<input name="a" type="key" id="27" value="1" />
		<input name="b" type="key" id="13" value="1" />
		<input name="pagedown" type="key" id="34" value="1" />
		<input name="pageup" type="key" id="33" value="1" />
		<input name="select" type="key" id="8" value="1" />
		<input name="start" type="key" id="32" value="1" />
		<input name="x" type="key" id="61" value="1" />
		<input name="y" type="key" id="45" value="1" />
	</inputConfig>
	<inputConfig type="joystick" deviceName="retrogame_joypad" deviceGUID="19009b4d4b4800000111000000010000">
		<input name="a"            type="button" id="0"  value="1" />
		<input name="b"            type="button" id="1"  value="1" />
		<input name="x"            type="button" id="3"  value="1" />
		<input name="y"            type="button" id="2"  value="1" />
		<input name="up"           type="button" id="13" value="1" />
		<input name="down"         type="button" id="14" value="1" />
		<input name="left"         type="button" id="15" value="1" />
		<input name="right"        type="button" id="16" value="1" />
		<input name="start"        type="button" id="9"  value="1" />
		<input name="select"       type="button" id="8"  value="1" />
		<input name="hotkey"       type="button" id="10" value="1" />
		<input name="l1"           type="button" id="4"  value="1" />
		<input name="r1"           type="button" id="5"  value="1" />
		<input name="l2"           type="button" id="6"  value="1" />
		<input name="r2"           type="button" id="7"  value="1" />
		<input name="l3"           type="button" id="11" value="1" />
		<input name="r3"           type="button" id="12" value="1" />
		<input name="pageup"       type="button" id="4"  value="1" />
		<input name="pagedown"     type="button" id="5"  value="1" />
		<input name="leftanalogleft"  type="axis" id="0" value="-1" />
		<input name="leftanalogright" type="axis" id="0" value="1" />
		<input name="leftanalogup"    type="axis" id="1" value="-1" />
		<input name="leftanalogdown"  type="axis" id="1" value="1" />
		<input name="rightanalogleft"  type="axis" id="2" value="-1" />
		<input name="rightanalogright" type="axis" id="2" value="1" />
		<input name="rightanalogup"    type="axis" id="3" value="-1" />
		<input name="rightanalogdown"  type="axis" id="3" value="1" />
		<input name="leftanalogx"      type="axis" id="0" value="1" />
		<input name="leftanalog"       type="axis" id="1" value="1" />
	</inputConfig>
</inputList>
