<?xml version="1.0" encoding="UTF-8"?>
<!-- One placeholder system, not a game list.  Two measured reasons it must ship:
     1) this ES fork prints "ERROR es_systems.cfg file does not exist!" and exits,
        which on a board with no keyboard reads as "EmulationStation is broken";
     2) with zero systems no theme is ever looked up, so a fresh image gives nothing
        to look at and the stick cannot be shown to navigate (see
        tools/emulationstation/verify/es-smoke-device.sh, phase A vs phase B).
     Put real cores/emulators in later and replace this entry. -->
<systemList>
  <system>
    <name>demo</name>
    <fullname>R36 demo system</fullname>
    <manufacturer>local</manufacturer>
    <release>2026</release>
    <hardware>test</hardware>
    <path>/root/roms/demo</path>
    <extension>.sh</extension>
    <command>%ROM%</command>
    <platform>pc</platform>
    <theme>pc</theme>
  </system>
</systemList>
