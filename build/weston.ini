# /etc/xdg/weston/weston.ini  -  r36max2 (RK3326, 1024x768 DSI panel, 1 GB RAM)
#
# Written for weston 14.0.2 on mainline 7.2.8 with panfrost.  Two things worth
# knowing before you edit this file:
#   * background-type only accepts centered|scale|scale-crop|scale-fit|tile -
#     anything else (uniform-color is a common guess) makes weston log
#     "invalid background-type" and fall back to the default.  A plain colour
#     background needs background-color only.
#   * there is no ini key that authorises screen capture; see r36-shot.py.

[core]
backend=drm-backend.so
# the panel has no alpha and our GBM tests picked XRGB8888 (vis_id 0x34325258)
gbm-format=xrgb8888
xkb-layout=us
# RK3326's VOP has no atomic async page flip, so DRM falls back to
# drm_atomic_helper_commit_tail_rpm, which waits for the flip-completion (vblank)
# event inside the commit worker and WARNs after ~41 s when it never arrives.
# weston's own wait gets the same treatment: give it a deadline so one lost
# vblank does not turn into a compositor that keeps queueing commits forever.
pageflip-timeout=500

[shell]
# this board cannot wake from suspend, and a compositor that blanks the panel
# behind a lock screen we cannot unlock (no keyboard) is a one-way door
locking=false
idle-time=0
background-color=0x102030ff

[output]
name=DSI-1
mode=1024x768
scale=1

[libinput]
# the joypad shows up as a joystick + event devices, not a touchpad
enable_tap=false
