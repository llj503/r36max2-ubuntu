# r36max2: 短按电源键既不能关机（logind 默认 poweroff，实测真关机），也不能睡眠
# （睡下去叫不醒，只能长按强制断电或按 reset）。唤醒链路修好之前保持 ignore；
# 长按 3-5 秒仍会由 PMIC 硬件强制关机，所以急停手段还在。
[Login]
HandlePowerKey=ignore
# 键名必须是 systemd 认识的那几个，写错了会被整行忽略（journal 里是
# "Unknown key name ... in section 'Login', ignoring"）。以前这里写的
# HandlePowerLongKey / HandleSleepKey 都不存在，所以两行一直没生效。
HandlePowerKeyLongPress=poweroff
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandleLidSwitch=ignore
# 别让空闲自动挂起把调试打断（要测唤醒时再临时开）
IdleAction=ignore
IdleActionSec=0
# 1 GB 内存，别留太多缓存
RemoveIPC=no
